<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VozInteractiva Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2193b0">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <!-- Overlay para cuando un panel está abierto -->
    <div class="overlay" id="overlay" onclick="closeAllPanels()"></div>

    <!-- Mobile Tabs -->
    <div class="mobile-tab left-tab" onclick="toggleMobilePanel('left')">
        <i class="fas fa-list-ul"></i>
        <i class="fas fa-chevron-right" style="font-size: 0.8rem; margin-left: 5px; opacity: 0.7;"></i>
    </div>
    
    <div class="mobile-tab right-tab" onclick="toggleMobilePanel('right')">
        <i class="fas fa-chevron-left" style="font-size: 0.8rem; margin-right: 5px; opacity: 0.7;"></i>
        <i class="fas fa-history"></i>
    </div>

    <div class="side-panel left-panel" id="left-panel">
        <h2 style="display: flex; justify-content: space-between; align-items: center;">
            <span><i class="fas fa-list-ul"></i> Predefinidos</span>
            <div class="header-actions">
                <button class="header-btn add-btn" onclick="openAddModal()" title="Agregar nuevo mensaje"><i class="fas fa-plus"></i></button>
                <button id="edit-mode-btn" class="header-btn" onclick="toggleEditMode()" title="Editar mensajes"><i class="fas fa-edit"></i></button>
            </div>
        </h2>
        <div id="predefined-list" style="flex: 1;"></div>
    </div>

    <div class="app-card">
        <h1><i class="fas fa-comment-dots"></i> Voz</h1>

        <div class="input-group">
            <textarea id="text-input" placeholder="Escribe aquí lo que quieres decir..."></textarea>
            
            <div class="visualizer-container" id="visualizer">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>

            <div class="punctuation-toolbar">
                <button class="punct-btn" onclick="applyPunctuation('!')" title="Añadir Exclamación / Emoción"><span>¡ !</span> 😃</button>
                <button class="punct-btn" onclick="applyPunctuation('?')" title="Añadir Pregunta / Duda"><span>¿ ?</span> 🤔</button>
                <button class="punct-btn" onclick="applyPunctuation('...')" title="Añadir Pausa"><span>...</span> 😐</button>
            </div>
        </div>

        <button class="main-btn" onclick="speak()">
            <i class="fas fa-volume-up"></i> Reproducir Voz
        </button>

        <div class="secondary-controls">
            <button class="btn-clear" onclick="clearText()">
                <i class="fas fa-trash-alt"></i> Borrar
            </button>
            <select id="voice-select">
                <option value="">Cargando voces...</option>
            </select>
        </div>

        <div class="slider-container">
            <label><i class="fas fa-tachometer-alt"></i> Velocidad de lectura</label>
            <input type="range" id="rate" min="0.5" max="1.8" value="1" step="0.1">
        </div>

        <p class="footer-info">Presiona Enter para hablar rápido</p>
    </div>

    <div class="side-panel right-panel" id="right-panel">
        <h2><i class="fas fa-history"></i> Historial</h2>
        <div id="history-list">
            <div class="empty-history">Aún no hay mensajes.</div>
        </div>
    </div>

    <!-- Modal para añadir nuevo mensaje -->
    <div id="add-modal" class="modal-overlay">
        <div class="modal-card">
            <h3><i class="fas fa-plus-circle"></i> Nuevo Mensaje</h3>
            <p>Escribe el mensaje que usarás frecuentemente.</p>
            <input type="text" id="new-predefined-input" placeholder="E.g. ¿Dónde está el baño?" onkeypress="if(event.key === 'Enter') { addPredefined(); }">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeAddModal()">Cancelar</button>
                <button class="btn-save" onclick="addPredefined()">Añadir</button>
            </div>
        </div>
    </div>

    <script src="./js/app.js"></script>

</body>

</html>
