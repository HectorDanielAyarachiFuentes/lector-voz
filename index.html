<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VozInteractiva Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2193b0">
    <style>
        :root {
            --bg-color: #eef2f7;
            --card-bg: #ffffff;
            --primary-gradient: linear-gradient(135deg, #6dd5ed, #2193b0);
            --danger-gradient: linear-gradient(135deg, #ff5f6d, #ffc371);
            --text-main: #2c3e50;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: grid;
            grid-template-columns: 280px 1fr 280px;
            gap: 20px;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        @media (max-width: 950px) {
            body {
                grid-template-columns: 1fr;
                align-items: start;
            }
            .left-panel { order: 2; height: 300px !important; }
            .app-card { order: 1; margin-bottom: 20px; }
            .right-panel { order: 3; height: 300px !important; }
        }

        .app-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 550px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
            box-sizing: border-box;
        }

        .side-panel {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow);
            height: 85vh;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            box-sizing: border-box;
        }
        
        .side-panel::-webkit-scrollbar {
            width: 6px;
        }
        
        .side-panel::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }

        .side-panel h2 {
            font-size: 1.2rem;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            color: #2193b0;
            border-bottom: 2px solid #eef2f7;
            padding-bottom: 12px;
            position: sticky;
            top: 0;
            background: var(--card-bg);
            z-index: 10;
        }

        .message-btn {
            background: #f8f9fa;
            border: 1px solid #eef2f7;
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 0.95rem;
            color: var(--text-main);
            transition: all 0.2s;
            line-height: 1.4;
        }

        .message-btn:hover {
            background: #eef2f7;
            border-color: #2193b0;
            transform: translateX(4px);
            box-shadow: 0 2px 8px rgba(33, 147, 176, 0.1);
        }

        .history-item {
            background: #f8f9fa;
            border-left: 4px solid #2193b0;
            padding: 12px 15px;
            border-radius: 0 10px 10px 0;
            margin-bottom: 10px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1.4;
        }

        .history-item:hover {
            background: #eef2f7;
            transform: translateX(-4px);
        }
        
        .empty-history {
            text-align: center;
            color: #bdc3c7;
            font-style: italic;
            font-size: 0.9rem;
            margin-top: 30px;
        }

        .edit-mode-btn {
            position: absolute;
            right: 0;
            top: 0;
            background: none;
            border: none;
            color: #bdc3c7;
            cursor: pointer;
            font-size: 1.1rem;
            transition: color 0.2s;
            padding: 2px 5px;
        }

        .edit-mode-btn:hover, .edit-mode-btn.active {
            color: #2193b0;
        }

        .add-predefined {
            display: none;
            gap: 10px;
            margin-top: auto;
            padding-top: 15px;
            border-top: 2px solid #eef2f7;
            position: sticky;
            bottom: 0;
            background: var(--card-bg);
        }

        .left-panel.edit-mode .add-predefined {
            display: flex;
        }

        .delete-btn {
            display: none;
            background: #f8f9fa;
            border: 1px solid #eef2f7;
            border-radius: 12px;
            color: #ff5f6d;
            cursor: pointer;
            padding: 0 12px;
            transition: all 0.2s;
        }

        .left-panel.edit-mode .delete-btn {
            display: block;
        }

        .delete-btn:hover {
            background: #ffe5e5;
            border-color: #ff5f6d;
        }

        .add-predefined input {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .add-predefined input:focus {
            border-color: #2193b0;
        }

        .add-predefined button {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .add-predefined button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(33, 147, 176, 0.2);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 160px;
            padding: 20px;
            border: 2px solid #f0f0f0;
            border-radius: 20px;
            font-size: 1.1rem;
            resize: none;
            box-sizing: border-box;
            background: #fafafa;
            transition: all 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: #2193b0;
            background: #fff;
            box-shadow: 0 0 15px rgba(33, 147, 176, 0.1);
        }

        .punctuation-toolbar {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            justify-content: center;
        }

        .punct-btn {
            background: #f8f9fa;
            border: 1px solid #eef2f7;
            color: #2c3e50;
            padding: 8px 15px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .punct-btn:hover {
            background: #eef2f7;
            border-color: #2193b0;
            color: #2193b0;
            transform: translateY(-2px);
        }

        .main-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: 600;
            color: white;
            background: var(--primary-gradient);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .main-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(33, 147, 176, 0.3);
        }

        .secondary-controls {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn-clear {
            background: var(--danger-gradient);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        select {
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #ddd;
            background: #fff;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .slider-container {
            text-align: left;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 15px;
        }

        .slider-container label {
            font-size: 0.85rem;
            color: #7f8c8d;
            display: block;
            margin-bottom: 8px;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: #2193b0;
        }

        .footer-info {
            margin-top: 20px;
            font-size: 0.75rem;
            color: #bdc3c7;
        }
    </style>
</head>

<body>

    <div class="side-panel left-panel" id="left-panel">
        <h2>
            <i class="fas fa-list-ul"></i> Predefinidos
            <button id="edit-mode-btn" class="edit-mode-btn" onclick="toggleEditMode()" title="Editar mensajes"><i class="fas fa-edit"></i></button>
        </h2>
        <div id="predefined-list" style="flex: 1;"></div>
        <div class="add-predefined">
            <input type="text" id="new-predefined-input" placeholder="Nuevo mensaje...">
            <button onclick="addPredefined()" title="Agregar nuevo mensaje"><i class="fas fa-plus"></i></button>
        </div>
    </div>

    <div class="app-card">
        <h1><i class="fas fa-comment-dots"></i> Voz</h1>

        <div class="input-group">
            <textarea id="text-input" placeholder="Escribe aquí lo que quieres decir..."></textarea>
            <div class="punctuation-toolbar">
                <button class="punct-btn" onclick="applyPunctuation('!')" title="Añadir Exclamación / Emoción"><span>¡ !</span> 😃</button>
                <button class="punct-btn" onclick="applyPunctuation('?')" title="Añadir Pregunta / Duda"><span>¿ ?</span> 🤔</button>
                <button class="punct-btn" onclick="applyPunctuation('...')" title="Añadir Pausa"><span>...</span> 😐</button>
            </div>
        </div>

        <button class="main-btn" onclick="speak()">
            <i class="fas fa-volume-up"></i> Reproducir Voz
        </button>

        <div class="secondary-controls">
            <button class="btn-clear" onclick="clearText()">
                <i class="fas fa-trash-alt"></i> Borrar
            </button>
            <select id="voice-select">
                <option value="">Cargando voces...</option>
            </select>
        </div>

        <div class="slider-container">
            <label><i class="fas fa-tachometer-alt"></i> Velocidad de lectura</label>
            <input type="range" id="rate" min="0.5" max="1.8" value="1" step="0.1">
        </div>

        <p class="footer-info">Presiona Enter para hablar rápido</p>
    </div>

    <div class="side-panel right-panel">
        <h2><i class="fas fa-history"></i> Historial</h2>
        <div id="history-list">
            <div class="empty-history">Aún no hay mensajes.</div>
        </div>
    </div>

    <script>
        const synth = window.speechSynthesis;
        const textInput = document.getElementById('text-input');
        const voiceSelect = document.getElementById('voice-select');
        const rateInput = document.getElementById('rate');

        let voices = [];

        function loadVoices() {
            voices = synth.getVoices();
            voiceSelect.innerHTML = '';

            // Filtramos para mostrar voces en español primero
            let spanishVoices = voices.filter(v => v.lang.includes('es'));

            // Priorizar voces Naturales, Online o de Google (suelen ser neuronales y mucho más expresivas)
            spanishVoices.sort((a, b) => {
                const aName = a.name.toLowerCase();
                const bName = b.name.toLowerCase();
                const aPremium = aName.includes('natural') || aName.includes('online') || aName.includes('google') || aName.includes('premium');
                const bPremium = bName.includes('natural') || bName.includes('online') || bName.includes('google') || bName.includes('premium');
                if (aPremium && !bPremium) return -1;
                if (!aPremium && bPremium) return 1;
                return 0;
            });

            spanishVoices.forEach(voice => {
                const option = document.createElement('option');
                
                // Añadir un indicador visual a las mejores voces
                const isPremium = voice.name.toLowerCase().match(/natural|online|google|premium/);
                const star = isPremium ? "⭐ " : "";
                
                option.textContent = `${star}${voice.name.replace('Microsoft', '').split(' - ')[0]} (${voice.lang})`;
                option.value = voice.name;
                voiceSelect.appendChild(option);
            });

            if (spanishVoices.length === 0) {
                const option = document.createElement('option');
                option.textContent = "No se hallaron voces en español";
                voiceSelect.appendChild(option);
            }
        }

        // Inicializar voces
        loadVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }

        function speak() {
            if (synth.speaking) { synth.cancel(); } // Si ya está hablando, reinicia
            const fullText = textInput.value.trim();
            
            if (fullText !== '') {
                const selectedVoice = voices.find(v => v.name === voiceSelect.value);
                const baseRate = parseFloat(rateInput.value);
                
                // Dividir el texto en oraciones conservando los signos de puntuación
                const sentences = fullText.match(/[^.!?]+[.!?]*/g) || [fullText];
                
                sentences.forEach(sentence => {
                    const text = sentence.trim();
                    if (!text) return;
                    
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.voice = selectedVoice;
                    
                    let currentPitch = 1;
                    let currentRate = baseRate;
                    
                    // Modificar drásticamente tono y velocidad para simular viveza
                    if (text.includes('!') || text.includes('¡')) {
                        currentPitch = 1.8; // Muy agudo y emocionado
                        currentRate = Math.min(baseRate * 1.25, 2); // Bastante más rápido
                    } else if (text.includes('?') || text.includes('¿')) {
                        currentPitch = 1.5; // Agudo inquisitivo
                        currentRate = Math.max(baseRate * 0.9, 0.5); // Ligeramente más pausado
                    } else if (text.includes('...')) {
                        currentPitch = 0.6; // Grave y misterioso
                        currentRate = Math.max(baseRate * 0.6, 0.5); // Muy lento
                    } else {
                        // Ligera variación natural para que cada frase suene un poco distinta y no tan robótica
                        currentPitch = 1.0 + (Math.random() * 0.1 - 0.05);
                    }
                    
                    // Si el texto está completamente en MAYÚSCULAS (simulando un grito)
                    if (text === text.toUpperCase() && text.match(/[A-ZÁÉÍÓÚ]/)) {
                        currentPitch = 1.7;
                        currentRate = Math.min(baseRate * 1.3, 2);
                    }
                    
                    utterance.pitch = currentPitch;
                    utterance.rate = currentRate;
                    
                    synth.speak(utterance);
                });
                
                addToHistory(fullText);
            }
        }

        function clearText() {
            textInput.value = '';
            synth.cancel();
        }

        function applyPunctuation(type) {
            const ta = document.getElementById('text-input');
            let start = ta.selectionStart;
            let end = ta.selectionEnd;
            let text = ta.value;

            // Si no hay texto, no hacemos nada
            if (text.trim() === '') return;

            // Si no hay texto seleccionado, seleccionamos todo
            if (start === end) {
                start = 0;
                end = text.length;
            }

            const selectedText = text.substring(start, end);
            
            // Limpiamos la puntuación que ya tenga a los lados para no duplicar (ej: ¡¡Hola!!)
            let cleanText = selectedText.replace(/^[¡¿]+|[!?.]+$/g, '').trim();

            let newText = '';
            if (type === '!') {
                newText = `¡${cleanText}!`;
            } else if (type === '?') {
                newText = `¿${cleanText}?`;
            } else if (type === '...') {
                newText = `${cleanText}...`;
            }

            ta.value = text.substring(0, start) + newText + text.substring(end);
            
            // Devolver el foco al textarea
            ta.focus();
        }

        // Evento de teclado
        textInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                speak();
            }
        });

        // --- Funciones del Historial ---
        const historyList = document.getElementById('history-list');
        let messageHistory = [];

        function addToHistory(text) {
            if (messageHistory[0] === text) return; // Evitar duplicados consecutivos
            
            messageHistory.unshift(text);
            if (messageHistory.length > 30) messageHistory.pop(); // Limitar a 30
            
            renderHistory();
        }

        function renderHistory() {
            if (messageHistory.length === 0) {
                historyList.innerHTML = '<div class="empty-history">Aún no hay mensajes.</div>';
                return;
            }

            historyList.innerHTML = '';
            messageHistory.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.textContent = msg;
                div.title = "Haz clic para copiar al texto";
                div.onclick = () => {
                    textInput.value = msg;
                };
                historyList.appendChild(div);
            });
        }

        // --- Mensajes Predefinidos ---
        const defaultMessages = [
            "Hola, ¿cómo estás?",
            "Muchas gracias",
            "Por favor",
            "Sí",
            "No",
            "No entiendo",
            "¿Me puedes ayudar?",
            "Buenos días",
            "Buenas tardes",
            "Buenas noches",
            "Adiós, hasta luego",
            "Me llamo Ramón",
            "Necesito ir al baño",
            "Tengo hambre",
            "Tengo sed",
            "Me duele"
        ];

        let predefinedMessages = [];
        const storedMessages = localStorage.getItem('predefinedMessages');
        if (storedMessages) {
            predefinedMessages = JSON.parse(storedMessages);
        } else {
            predefinedMessages = [...defaultMessages];
        }

        const predefinedList = document.getElementById('predefined-list');
        let isEditMode = false;
        
        function toggleEditMode() {
            isEditMode = !isEditMode;
            const panel = document.getElementById('left-panel');
            const btn = document.getElementById('edit-mode-btn');
            
            if (isEditMode) {
                panel.classList.add('edit-mode');
                btn.classList.add('active');
                btn.innerHTML = '<i class="fas fa-check"></i>';
                btn.title = "Terminar edición";
            } else {
                panel.classList.remove('edit-mode');
                btn.classList.remove('active');
                btn.innerHTML = '<i class="fas fa-edit"></i>';
                btn.title = "Editar mensajes";
            }
        }
        
        function renderPredefined() {
            predefinedList.innerHTML = '';
            predefinedMessages.forEach((msg, index) => {
                const btnContainer = document.createElement('div');
                btnContainer.style.display = 'flex';
                btnContainer.style.gap = '8px';
                btnContainer.style.marginBottom = '10px';
                btnContainer.style.alignItems = 'stretch';

                const btn = document.createElement('button');
                btn.className = 'message-btn';
                btn.style.flex = '1';
                btn.style.marginBottom = '0';
                btn.textContent = msg;
                btn.onclick = () => {
                    textInput.value = msg;
                    speak(); 
                };

                const deleteBtn = document.createElement('button');
                deleteBtn.innerHTML = '<i class="fas fa-trash"></i>';
                deleteBtn.className = 'delete-btn';
                deleteBtn.title = "Eliminar mensaje";
                deleteBtn.onclick = () => removePredefined(index);

                btnContainer.appendChild(btn);
                btnContainer.appendChild(deleteBtn);
                predefinedList.appendChild(btnContainer);
            });
            localStorage.setItem('predefinedMessages', JSON.stringify(predefinedMessages));
        }

        function addPredefined() {
            const input = document.getElementById('new-predefined-input');
            const val = input.value.trim();
            if (val) {
                predefinedMessages.push(val);
                input.value = '';
                renderPredefined();
            }
        }

        function removePredefined(index) {
            predefinedMessages.splice(index, 1);
            renderPredefined();
        }

        document.getElementById('new-predefined-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                addPredefined();
            }
        });

        renderPredefined();

        // Registrar Service Worker para soporte Offline
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registrado con éxito: ', registration.scope);
                    })
                    .catch(error => {
                        console.log('Fallo al registrar el ServiceWorker: ', error);
                    });
            });
        }
    </script>

</body>

</html>
